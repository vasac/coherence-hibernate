# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven
name: CI Coherence Hibernate
run-name: ${{ github.event.head_commit.message }} [${{ github.event_name }}][${{ github.ref_name }}]
on:
  push:
    branches:
      - main
      - '[1-9]+.[0-9]+.x'
  pull_request:
    branches:
      - main
      - '[1-9]+.[0-9]+.x'
  workflow_dispatch:
jobs:
  build:
    if: github.repository_owner == 'coherence-community'
    strategy:
      matrix:
        java-version: [ '17', '21' ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4.7.1
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java-version }}
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-jdk-${{ matrix.java-version }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2-
    - name: Build - Hibernate 7.4.x on Java ${{ matrix.java-version }}
      run: ./mvnw clean verify -B -Pcoverage
    - name: Analyze Hibernate 7.4.x build with Sonar
      if: "github.event_name != 'pull_request' && matrix.java-version == '17'"
      run: |
        git config --global user.email "github-action@users.noreply.github.com"
        git config --global user.name "GitHub Action"
        ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=coherence-community_coherence-hibernate -Dsonar.branch.name=${{ env.GITHUB_REF_NAME }} -B
      env:
        MAVEN_GITHUB_TOKEN: "${{secrets.GITHUB_TOKEN}}"
        GITHUB_TOKEN: "${{secrets.GITHUB_TOKEN}}"
        SONAR_TOKEN: "${{secrets.SONAR_TOKEN}}"
    - name: Check dependencies for known vulnerabilities
      if: "github.event_name != 'pull_request' && matrix.java-version == '17'"
      run: ./mvnw verify -B -DskipTests -Powasp
      env:
        NVD_API_KEY: "${{secrets.NVD_API_KEY}}"
    - name: Build and deploy website and snapshots
      if: "github.event_name != 'pull_request' && matrix.java-version == '17'"
      run: |
          git config --global user.email "github-action@users.noreply.github.com"
          git config --global user.name "GitHub Action"
          ./mvnw deploy -B -DskipTests --settings .mvn/settings.xml
      env:
        MAVEN_GITHUB_TOKEN: "${{secrets.GITHUB_TOKEN}}"
        MAVEN_SONATYPE_USERNAME: "${{secrets.MAVEN_SONATYPE_USERNAME}}"
        MAVEN_SONATYPE_TOKEN: "${{secrets.MAVEN_SONATYPE_TOKEN}}"
    - name: Clean Maven cache
      run: |
        find ~/.m2/repository -type d -name '*SNAPSHOT' | xargs rm -fr
